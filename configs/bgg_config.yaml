# RecBole CTR Pipeline Configuration
# Configuration for context-aware recommendation models with baselines

# GPU settings (will be overridden by runtime check)
use_gpu: true

# Path configuration
paths:
  data: ./data
  output_base: ./outputs

# Training settings
training:
  gpu: 0
  seed: 42

# Evaluation settings
evaluation:
  top_k: 50
  cutoffs:
    - 5
    - 10
    - 20
  ranx_metrics:
    - map@10
    - mrr@10
    - ndcg@5
    - ndcg@10
    - precision@5
    - recall@10
  ctr_metrics:
    - AUC
    - LogLoss

# Rating threshold for binary classification
rating_threshold: 7.0

# Model configurations
models:
  # =========================================================================
  # NON-CONTEXT-AWARE BASELINES
  # =========================================================================
  # These models ignore context and serve as lower bounds for performance
  
  Random:
    # Random baseline: recommends items with uniform random probability
    # - No training required
    # - Ignores all features (user, item, context)
    # - Provides absolute lower bound
    params: {}
  
  Pop:
    # Popularity baseline: recommends most popular items to everyone
    # - Uses only item interaction counts from training data
    # - Ignores user preferences and context
    # - Often surprisingly strong baseline
    # - Same recommendations for all users
    params: {}
  
  # =========================================================================
  # CONTEXT-AWARE CTR MODELS
  # =========================================================================
  # These models use context information for personalized recommendations
  
  FM:
    # Factorization Machines
    # - Models pairwise feature interactions
    # - Linear time complexity in number of features
    # - Uses context as additional feature
    params:
      embedding_size: 64
      lr: 0.001
      epochs: 50
      batch_size: 2048
      reg_weight: 0.0001
      stopping_step: 10
  
  AFM:
    # Attentional Factorization Machines
    # - Adds attention mechanism to FM
    # - Learns importance of feature interactions
    # - Can focus on context-relevant interactions
    params:
      embedding_size: 128
      attention_size: 128
      dropout: 0.05
      lr: 0.0005
      epochs: 100
      batch_size: 4096
      reg_weight: 0.00001
      stopping_step: 15
  
  FFM:
    # Field-aware Factorization Machines
    # - Different embeddings for each field pair
    # - More expressive than FM
    # - Can model context-user and context-item interactions separately
    params:
      embedding_size: 64
      lr: 0.001
      epochs: 50
      batch_size: 2048
      reg_weight: 0.0001
      stopping_step: 10
  
  FwFM:
    # Field-weighted Factorization Machines
    # - Learns field importance weights
    # - Can weight context field appropriately
    params:
      embedding_size: 64
      dropout: 0.1
      lr: 0.001
      epochs: 50
      batch_size: 2048
      reg_weight: 0.0001
      stopping_step: 10