general:
  experiment_name: "bgg_test"
  device: "cuda"
  backend: "polars"
  time_report: True

dashboard:
  wandb:
    enabled: True
    team: "i-buonfrate-politecnico-di-bari"
    project: "EvaluateCars"
    api_key: "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"
    group: "bgg_experiments"
    log_config: True
    upload_checkpoints: False
  codecarbon:
    enabled: True
    save_to_file: True
    output_dir: "results/carbon/"
    tracking_mode: "machine"

writer:
  dataset_name: "BGG"
  writing_method: "local"
  local_experiment_path: "results/"
  setup_experiment: True
  save_split: True
  recommendation:
    k: 10
    save: True

reader:
  loading_strategy: "dataset"
  data_type: "transaction"
  reading_method: "local"
  rating_type: "explicit"
  local_path: "warp_output/bgg_context_ready.tsv"
  sep: "\t"
  header: True
  labels:
    user_id_label: "user_id"
    item_id_label: "item_id"
    rating_label: "rating"
    timestamp_label: "timestamp"
  context_features:
    - playing_time_very_short
    - playing_time_short
    - playing_time_moderate
    - playing_time_long
    - playing_time_very_long
    - gaming_mood_party
    - "gaming_mood_easy-going"
    - gaming_mood_expert
    - gaming_mood_intense
    - gaming_mood_cooperative
    - gaming_mood_competitive
    - gaming_mood_thematic
    - "gaming_mood_story-based"
    - "social_companion_1-player"
    - "social_companion_2-players"
    - "social_companion_large-group"
    - social_companion_toddlers
    - social_companion_preschoolers
    - social_companion_children
    - social_companion_family
    - social_companion_friends
  dtypes:
    user_id_type: "str"
    item_id_type: "str"
    rating_type: "float32"
    timestamp_type: "str"

splitter:
  test_splitting:
    strategy: "temporal_leave_k_out"
    k: 1
  validation_splitting:
    strategy: "temporal_leave_k_out"
    k: 1

models:
  Pop:
    meta:
      save_recs: True
  Random:
    meta:
      save_recs: True
  AFM:
    embedding_size: 64
    attention_size: 64
    dropout: 0.3
    reg_weight: 0.001
    weight_decay: 0.0001
    batch_size: 2048
    epochs: 100
    learning_rate: 0.001
    neg_samples: 2
    meta:
      save_recs: True
    early_stopping:
      monitor: "score"
      patience: 10
      grace_period: 20
      min_delta: 0.0001
  FM:
    embedding_size: 64
    reg_weight: 0.001
    batch_size: 2048
    epochs: 100
    learning_rate: 0.001
    neg_samples: 2
    meta:
      save_recs: True
    early_stopping:
      monitor: "score"
      patience: 10
      grace_period: 20
      min_delta: 0.0001
  DeepFM:
    embedding_size: 64
    mlp_hidden_size: [64, 32]
    dropout: 0.3
    reg_weight: 0.001
    weight_decay: 0.0001
    batch_size: 2048
    epochs: 100
    learning_rate: 0.001
    neg_samples: 2
    meta:
      save_recs: True
    early_stopping:
      monitor: "score"
      patience: 10
      grace_period: 20
      min_delta: 0.0001
  NFM:
    embedding_size: 64
    mlp_hidden_size: [64, 32]
    dropout: 0.3
    reg_weight: 0.001
    weight_decay: 0.0001
    batch_size: 2048
    epochs: 100
    learning_rate: 0.001
    neg_samples: 2
    meta:
      save_recs: True
    early_stopping:
      monitor: "score"
      patience: 10
      grace_period: 20
      min_delta: 0.0001

  xDeepFM:
    embedding_size: 16          
    mlp_hidden_size: [16, 8]    
    cin_layer_size: [16]     
    dropout: 0.4
    direct: True
    reg_weight: 0.001
    weight_decay: 0.0001
    batch_size: 512
    epochs: 100
    learning_rate: 0.001
    neg_samples: 2
    meta:
      save_recs: False
    early_stopping:
      monitor: "score"
      patience: 10
      grace_period: 20
      min_delta: 0.0001

evaluation:
  top_k: [5, 10]
  metrics: ["AUC", "NDCG", "MAP", "MRR", "PRECISION", "RECALL"]
  complex_metrics:
    - name: "ACC"
      params: {}
    - name: "CS"
      params: {}
    - name: "WCS"
      params: {}
    - name: "WCS_Group"
      params:
        group_definitions:
          Playtime: [0, 1, 2, 3, 4]
          Mood:     [5, 6, 7, 8, 9, 10, 11, 12]
          Social:   [13, 14, 15, 16, 17, 18, 19, 20]
    - name: "WCA"
      params: {}
    - name: "Friction"
      params: {}
    - name: "CR"
      params: {}
    - name: "CRC"
      params: {}
    - name: "CGB"
      params: {}
    - name: "CW-nDCG"
      params: {}
    - name: "CW-MAP"
      params: {}
  relevance_threshold: 7.0
  save_per_user: False