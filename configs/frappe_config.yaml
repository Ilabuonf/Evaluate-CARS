# Frappe Context-Aware Recommendation Pipeline Configuration
# Following BoardGameGeek study methodology

# Path configuration
paths:
  data: "data/frappe"  # Directory containing frappe_train.csv, frappe_valid.csv, frappe_test.csv
  output_base: "output/frappe"  # Base directory for all outputs

# Training configuration
training:
  seed: 2024
  gpu: 0  # GPU ID to use (if available)

# Model configuration
models:
  # Baseline models (non-context-aware)
  Random:
    params: {}
  
  Pop:
    params: {}
  
  # Context-aware CTR models
  FM:
    params:
      epochs: 50
      batch_size: 2048
      lr: 0.001
      embedding_size: 64
      learner: "adam"
      stopping_step: 10
      reg_weight: 0.0001
  
  FFM:
    params:
      epochs: 50
      batch_size: 2048
      lr: 0.001
      embedding_size: 64
      learner: "adam"
      stopping_step: 10
      reg_weight: 0.0001
  
  AFM:
    params:
      epochs: 50
      batch_size: 2048
      lr: 0.001
      embedding_size: 64
      attention_size: 64
      dropout: 0.1
      learner: "adam"
      stopping_step: 10
      reg_weight: 0.0001
  
  FwFM:
    params:
      epochs: 50
      batch_size: 2048
      lr: 0.001
      embedding_size: 64
      learner: "adam"
      stopping_step: 10
      reg_weight: 0.0001

# Evaluation configuration
evaluation:
  top_k: 50  # Generate top-K recommendations
  
  # Traditional ranking metrics (computed with ranx)
  ranx_metrics:
    - "ndcg@5"
    - "ndcg@10"
    - "map@10"
    - "mrr@10"
    - "precision@5"
    - "recall@10"
  
  # Context-aware metrics (k values)
  context_k_values: [5, 10, 20]
  
  # Context satisfaction alpha parameter (penalty weight)
  cs_alpha: 0.5

# Feature groups for dimensional analysis
feature_groups:
  temporal:
    - daytime
    - weekday
    - isweekend
  activity:
    - homework
    - cost
  environment:
    - weather
    - country
    - city